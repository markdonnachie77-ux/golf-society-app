project_id = "golf-society-app"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Auth/Realtime/Edge Functions are disabled — this app uses a custom
# 4-digit PIN login (see lib/auth.ts), not Supabase Auth, and doesn't use
# Realtime. Storage is enabled for per-society hero photo uploads (see
# supabase/migrations/0016_hero_photo_storage.sql).
[auth]
enabled = false

[storage]
enabled = true

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
